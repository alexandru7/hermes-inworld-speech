# Example Hermes configuration for the inworld-speech plugin.
# Only `provider` and `model` are required; everything else has a default.
# Set INWORLD_API_KEY in the Hermes environment or profile .env — never here.

tts:
  provider: inworld
  output_format: mp3          # mp3 | wav | ogg | opus | flac
  inworld:
    model: inworld-tts-2-flash
    voice: Dennis
    max_text_length: 2000     # clamped to Inworld's 2000-character ceiling
    sample_rate_hertz: 24000
    timeout_seconds: 30       # per attempt; total is this x max_attempts
    max_attempts: 3

    # Optional extras, unset by default:
    # speaking_rate: 1.0      # [0.5, 1.5]; Hermes' speed argument wins
    # language: en-US         # omit or 'auto' to let Inworld decide
    # instruction: "Speak warmly and unhurriedly."
    # temperature: 1.0        # (0, 2]; ignored by inworld-tts-2
    # delivery_mode: BALANCED # STABLE | BALANCED | CREATIVE; inworld-tts-2 only
    # apply_text_normalization: "ON"
    # enhance_generation: true
    # bit_rate: 128000

stt:
  enabled: true
  provider: inworld
  inworld:
    model: inworld/inworld-stt-1
    language: auto            # or a BCP-47 tag such as en-US
    max_file_bytes: 26214400  # 25 MiB
    timeout_seconds: 30
    max_attempts: 3
